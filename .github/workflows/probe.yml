name: Probe Overpass (temporary)
on:
  push:
    branches: [ccr-a4c0e28d-u86q7r]
    paths: [tools/probe-overpass.mjs, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: node tools/probe-overpass.mjs
