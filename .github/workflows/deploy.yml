name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # Re-run by hand after adding or changing the Google key: config.js is written at build time.
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push cancels the older run. main: runs queue and a deploy is never cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # node --test with globs needs Node 21+
          package-manager-cache: false
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Write config.js and stamp the service worker
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }} # empty when the secret isn't set
          GOOGLE_MAP_ID: ${{ vars.GOOGLE_MAP_ID }} # empty when the variable isn't set
          BUILD_ID: ${{ github.sha }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const build = process.env.BUILD_ID.slice(0, 12);
            const config = {
              googleMapsApiKey: (process.env.GOOGLE_MAPS_API_KEY || "").trim(),
              googleMapId: (process.env.GOOGLE_MAP_ID || "").trim(),
              build,
            };
            const configText = "window.APP_CONFIG = " + JSON.stringify(config, null, 2) + ";\n";
            writeFileSync("site/config.js", configText);
            // The stamp also changes when only the config does (e.g. re-running the
            // deploy after adding the key), so the offline copy picks it up.
            const stamp = build + "-" + createHash("sha256").update(configText).digest("hex").slice(0, 8);
            const sw = readFileSync("site/sw.js", "utf8");
            if (!sw.includes("__BUILD__")) throw new Error("site/sw.js has no __BUILD__ placeholder");
            writeFileSync("site/sw.js", sw.replaceAll("__BUILD__", stamp));
            console.log(config.googleMapsApiKey
              ? "Google Maps key: set"
              : "::warning title=No Google key::GOOGLE_MAPS_API_KEY is not set, deploying the OpenStreetMap-only version");
          '

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
