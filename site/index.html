<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>מקום באמצע</title>
    <meta
      name="description"
      content="מכניסים שתי נקודות יציאה, ומקבלים בתי קפה, קניונים, פארקים ומקומות יפים שנמצאים באותו זמן נסיעה משני הצדדים."
    />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>

    <main class="layout">
      <div class="panel">
        <header class="app-header">
          <svg class="brand-mark" viewBox="0 0 44 16" aria-hidden="true"><path class="brand-line" d="M6 8h32" /><circle class="brand-a" cx="38" cy="8" r="4" /><circle class="brand-b" cx="6" cy="8" r="4" /><circle class="brand-mid" cx="22" cy="8" r="5.5" /></svg>
          <div>
            <h1>מקום באמצע</h1>
            <p class="tagline">נפגשים בדיוק באמצע הדרך</p>
          </div>
        </header>
        <form id="search-form" class="card search-form" novalidate>
          <div class="endpoints">
            <div class="endpoint" data-side="a">
              <label class="endpoint-label" for="input-a">
                <span class="side-badge side-a" aria-hidden="true">א</span>
                <span class="sr-only">נקודת יציאה א׳</span>
              </label>
              <div class="combo">
                <input
                  id="input-a"
                  name="a"
                  type="text"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-expanded="false"
                  aria-controls="list-a"
                  autocomplete="off"
                  enterkeyhint="next"
                  placeholder="למשל: חיפה"
                  required
                />
                <button type="button" class="icon-button locate" data-side="a" title="המיקום שלי" aria-label="שימוש במיקום שלי">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="7" fill="none" /></svg>
                </button>
                <ul id="list-a" class="suggestions" role="listbox" aria-label="הצעות לנקודה א׳" hidden></ul>
              </div>
              <div class="mode-toggle" role="radiogroup" aria-label="איך מגיעים מנקודה א׳">
                <label title="רכב"><input type="radio" name="mode-a" value="car" checked /><span><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16.5v-4.2L6.6 7h10.8l2.1 5.3v4.2M4.5 16.5h15M4.5 12.3h15M6.5 16.5v2M17.5 16.5v2" /><circle cx="8" cy="14.4" r=".6" /><circle cx="16" cy="14.4" r=".6" /></svg><span class="sr-only">רכב</span></span></label>
                <label title="תחבורה ציבורית"><input type="radio" name="mode-a" value="transit" /><span><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="14" rx="2.5" /><path d="M5.5 11h13M8.5 17.5v2.5M15.5 17.5v2.5" /><circle cx="8.6" cy="14.3" r=".6" /><circle cx="15.4" cy="14.3" r=".6" /></svg><span class="sr-only">תחבורה ציבורית</span></span></label>
              </div>
            </div>

            <button type="button" id="swap" class="icon-button swap" title="החלפה" aria-label="החלפה בין נקודה א׳ לנקודה ב׳">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v14M7 4 3.5 7.5M7 4l3.5 3.5M17 20V6M17 20l-3.5-3.5M17 20l3.5-3.5" /></svg>
            </button>

            <div class="endpoint" data-side="b">
              <label class="endpoint-label" for="input-b">
                <span class="side-badge side-b" aria-hidden="true">ב</span>
                <span class="sr-only">נקודת יציאה ב׳</span>
              </label>
              <div class="combo">
                <input
                  id="input-b"
                  name="b"
                  type="text"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-expanded="false"
                  aria-controls="list-b"
                  autocomplete="off"
                  enterkeyhint="search"
                  placeholder="למשל: תל אביב"
                  required
                />
                <button type="button" class="icon-button locate" data-side="b" title="המיקום שלי" aria-label="שימוש במיקום שלי">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="7" fill="none" /></svg>
                </button>
                <ul id="list-b" class="suggestions" role="listbox" aria-label="הצעות לנקודה ב׳" hidden></ul>
              </div>
              <div class="mode-toggle" role="radiogroup" aria-label="איך מגיעים מנקודה ב׳">
                <label title="רכב"><input type="radio" name="mode-b" value="car" checked /><span><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16.5v-4.2L6.6 7h10.8l2.1 5.3v4.2M4.5 16.5h15M4.5 12.3h15M6.5 16.5v2M17.5 16.5v2" /><circle cx="8" cy="14.4" r=".6" /><circle cx="16" cy="14.4" r=".6" /></svg><span class="sr-only">רכב</span></span></label>
                <label title="תחבורה ציבורית"><input type="radio" name="mode-b" value="transit" /><span><svg class="mode-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="14" rx="2.5" /><path d="M5.5 11h13M8.5 17.5v2.5M15.5 17.5v2.5" /><circle cx="8.6" cy="14.3" r=".6" /><circle cx="15.4" cy="14.3" r=".6" /></svg><span class="sr-only">תחבורה ציבורית</span></span></label>
              </div>
            </div>
          </div>

          <fieldset class="categories">
            <legend>מה מחפשים?</legend>
            <div id="category-chips" class="chips"></div>
          </fieldset>

          <fieldset class="categories">
            <legend>סינון</legend>
            <div class="group">
              <label class="switch-row">
                <span class="switch-text">
                  רק בתוך הקו הירוק
                  <small>בלי יהודה ושומרון ועזה</small>
                </span>
                <input type="checkbox" class="switch" id="only-green-line" />
              </label>
              <label class="switch-row">
                <span class="switch-text">
                  סגור בשבת
                  <small>בתי קפה ומסעדות ששעות הפתיחה שלהם מראות שהם סגורים בשבת. סימן טוב לכשרות, לא אישור.</small>
                </span>
                <input type="checkbox" class="switch" id="only-shabbat-closed" />
              </label>
            </div>
          </fieldset>

          <div class="when group">
            <label for="departure-choice">מתי יוצאים</label>
            <div class="when-row">
              <select id="departure-choice" aria-label="זמן יציאה">
                <option value="now">עכשיו</option>
                <option value="later">בזמן אחר…</option>
              </select>
              <input id="departure" type="datetime-local" hidden />
            </div>
          </div>

          <button type="submit" id="submit" class="primary-button">מצאו לנו מקום באמצע</button>
        </form>

        <div class="status-region" role="status" aria-live="polite">
          <div id="status" class="status" hidden></div>
        </div>

        <section id="results" class="results" hidden aria-labelledby="results-title">
          <div class="results-head">
            <h2 id="results-title">מקומות באמצע</h2>
            <button type="button" id="share-search" class="ghost-button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="19" r="2.5" /><path d="m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6" /></svg>
              שיתוף החיפוש
            </button>
          </div>
          <p id="results-summary" class="results-summary"></p>
          <div id="result-filters" class="chips result-filters" role="group" aria-label="סינון התוצאות"></div>
          <ol id="place-list" class="place-list"></ol>
        </section>
      </div>

      <section class="map-wrap" aria-label="מפה">
        <div id="map" class="map" dir="ltr"></div>
        <!-- While the map is zoomed in: the whole search, small, in the corner. -->
        <div id="overview" class="overview" hidden>
          <div class="overview-map" dir="ltr" inert></div>
          <button type="button" class="overview-button" title="הצגת כל החיפוש" aria-label="הצגת כל החיפוש במפה">
            <svg class="overview-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" /></svg>
          </button>
        </div>
        <div id="map-placeholder" class="map-placeholder">
          <svg class="brand-mark brand-mark-large" viewBox="0 0 44 16" aria-hidden="true"><path class="brand-line" d="M6 8h32" /><circle class="brand-a" cx="38" cy="8" r="4" /><circle class="brand-b" cx="6" cy="8" r="4" /><circle class="brand-mid" cx="22" cy="8" r="5.5" /></svg>
          <p>המפה תופיע כאן אחרי החיפוש</p>
        </div>
      </section>
    </main>

    <div role="status" aria-live="polite">
      <div id="toast" class="toast" hidden></div>
    </div>

    <footer class="app-footer">
      <p id="provider-note" class="provider-note"></p>
      <p id="attribution" class="attribution"></p>
      <p>
        <a href="https://github.com/itaigree/InTheMiddle" target="_blank" rel="noopener">קוד פתוח ב-GitHub · הצעות ודיווח על בעיות</a>
      </p>
    </footer>

    <template id="place-card-template">
      <li class="place-card">
        <button type="button" class="place-main">
          <span class="place-rank" aria-hidden="true"></span>
          <span class="place-photo" aria-hidden="true"></span>
          <span class="place-body">
            <span class="place-number sr-only"></span>
            <span class="place-name"></span>
            <span class="place-meta"></span>
            <span class="place-times">
              <span class="time time-a"><span class="side-badge side-a" aria-hidden="true">א</span><span class="time-who sr-only"></span><span class="time-value"></span></span>
              <span class="time time-b"><span class="side-badge side-b" aria-hidden="true">ב</span><span class="time-who sr-only"></span><span class="time-value"></span></span>
              <span class="fairness"></span>
            </span>
          </span>
        </button>
        <div class="place-actions">
          <a class="action waze" target="_blank" rel="noopener">Waze</a>
          <a class="action gmaps" target="_blank" rel="noopener">Google Maps</a>
          <button type="button" class="action share-place">שיתוף</button>
        </div>
      </li>
    </template>
  </body>
</html>
